<template>

    <!--  FAMILY SCREEN -->
    <template if:false={showMembers}>

       
        <lightning-card>

<div class="header-section">
    <h1>🏠 Family Dashboard</h1>
    <p>Manage Families & Family Members</p>
</div>
         
<h2 class="dashboard-title">
    Dashboard Summary
</h2>


<div class="stats-container">

    <div class="stat-card">
        <div class="stat-number">
            {totalFamilies}
        </div>
        <div class="stat-label">
            🏠 Total Families
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-number">
            {totalMembers}
        </div>
        <div class="stat-label">
            👤 Total Members
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-number">
            {activeLoans}
        </div>
        <div class="stat-label">
            🏦 Active Loans
        </div>
    </div>

    <div class="stat-card">
        <div class="stat-number">
            {totalTransactions}
        </div>
        <div class="stat-label">
            💰 Transactions
        </div>
    </div>

</div>
    
         <!-- ADD BUTTON (RIGHT SIDE) -->
    
    <div class="slds-grid slds-grid_align-end slds-wrap slds-p-horizontal_small slds-m-bottom_small">
        <!-- DELETE SELECTED -->
        <template if:true={selectedRows.length}>
            <lightning-button
                label="Delete Selected"
                icon-name="utility:delete"
                variant="destructive"
                class="slds-m-right_small"
                onclick={handleBulkDelete}>
            </lightning-button>
          </template>

    <!-- ADD FAMILY -->
    <lightning-button 
        label="Add Family"
        icon-name="utility:user" 
        variant="brand"
        onclick={openModal}>
    </lightning-button>

    </div>
    
  <div class="slds-box slds-theme_default slds-m-bottom_medium">

    <lightning-input
        type="search"
        label="🔍 Search Family"
        onchange={handleSearch}>
    </lightning-input>

</div>


         <template if:true={families.length}>   
            <!-- TABLE -->
            <lightning-datatable
                key-field="Id"
                data={families}
                columns={columns}
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}>
            </lightning-datatable>
         </template>
        
    <template if:false={families.length}>

    <div class="empty-state">

        <div class="empty-icon">
            📂
        </div>

        <h2>No Families Found</h2>

        <p>
            Click Add Family to create your first family.
        </p>

    </div>

  </template>
  </lightning-card>

    </template>


    
    <!-- MEMBER SCREEN (FULL PAGE SWITCH) -->
     <template if:true={showMembers}>

            <c-member 
                family-id={selectedFamilyId}
                onbacktofamily={handleBack}
                onrefreshdashboard={handleDashboardRefresh}>
            </c-member>

     </template>

    <!-- ADD MODAL -->
    <template if:true={showModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Add Family</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input 
                        label="Family Name"
                        required
                        onchange={handleFamilyName}>
                    </lightning-input>

                    <lightning-input
                        label="Head Name"
                        onchange={handleMemberName}>
                    </lightning-input>

                    <lightning-input
                        label="Address"
                        onchange={handleAddress}>
                    </lightning-input>

                    <lightning-input
                        type="number"
                        label="Age"
                        max="120"
                        min="1"
                        onchange={handleAge}>
                    </lightning-input>

                    <lightning-input
                        type="tel"
                        label="Phone"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        message-when-pattern-mismatch="Enter valid 10 digit phone number"
                        onchange={handlePhone}>
                    </lightning-input>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" 
                    class="slds-m-right_small"
                    onclick={closeModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={saveFamily}></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!--  EDIT MODAL -->
    <template if:true={showEditModal}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Edit Family</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input 
                        label="Family Name"
                        value={familyName}
                        onchange={handleFamilyName}>
                    </lightning-input>

                    <lightning-combobox
                    label="Head of Family"
                    value={selectedHeadId}
                    options={memberOptions}
                    placeholder="Select Head"
                    onchange={handleHeadChange}>
                </lightning-combobox>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel"
                    class="slds-m-right_small"
                    onclick={closeEditModal}>
                </lightning-button>
                    <lightning-button label="Update" variant="brand" onclick={updateFamilyHandler}></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    

    <!-- SINGLE DELETE MODAL -->
<template if:true={showDeleteModal}>

    <section class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <h2>Confirm Delete</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                 <p>
                        Are you sure you want to delete "{familyName}"?
                    </p>

            </div>

            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    class="slds-m-right_small"
                    onclick={closeDeleteModal}>
                </lightning-button>

                <lightning-button
                    label="Delete"
                    variant="destructive"
                    onclick={confirmDelete}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
    <!-- BULK DELETE CONFIRM MODAL -->
<template if:true={showBulkDeleteModal}>

    <section class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">

            <header class="slds-modal__header">

                <h2>Confirm Delete</h2>

            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <p>
                    Are you sure you want to delete selected families?
                </p>

            </div>

            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    class="slds-m-right_small"
                    onclick={closeBulkDeleteModal}>
                </lightning-button>

                <lightning-button
                    label="Delete"
                    variant="destructive"
                    onclick={confirmBulkDelete}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>

</template>
