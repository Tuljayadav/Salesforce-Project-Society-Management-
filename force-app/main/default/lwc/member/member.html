<template>
    <!-- MEMBER DASHBOARD -->
    <template if:false={showTransactions}>
        <template if:false={showLoans}>

        <template if:true={familyId}>
            
            <lightning-card title="Member Dashboard">

                
                <div class="dashboard-stats">

    <div class="stat-card">
        👨 Members
        <h2>{totalMembers}</h2>
    </div>

    <div class="stat-card">
        💰 Loan Eligible
        <h2>{eligibleMembers}</h2>
    </div>

</div>
                
 <!-- TOP BUTTONS -->
    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    
             <div>
                    <lightning-button 
                        label="⬅ Back to Family"
                        onclick={handleBackToFamily}>
                    </lightning-button>
              </div>
         <!-- DELETE SELECTED -->
             <div class="slds-grid slds-grid_align-end slds-m-bottom_small">

                    <template if:true={selectedRows.length}>
                        <lightning-button
                            label="Delete Selected"
                            icon-name="utility:delete"
                            variant="destructive"
                            class="slds-m-right_small"
                            onclick={handleBulkDelete}>
                        </lightning-button>
                    </template>

                    <!-- VIEW TRANSACTION -->
                     
                    <lightning-button
                        label="View Transactions"
                        icon-name="utility:money"
                        variant="brand"
                        class="slds-m-right_small"
                        onclick={openTransactions}>
                    </lightning-button>

                    <lightning-button
                        label="Loan Center"
                        icon-name="utility:moneybag"
                        class="slds-m-right_small"
                        variant="success"
                        onclick={openLoans}>
                    </lightning-button>

                    <!-- ADD MEMBER -->
                    <lightning-button 
                        label="Add Member"
                        icon-name="utility:user" 
                        variant="brand"
                        onclick={openModal}>
                    </lightning-button>

                </div>
         </div>
            
                 <!-- SEARCH -->
                <lightning-input
                    type="search"
                    label="Search Member"
                    onchange={handleSearch}>
                </lightning-input>

                <!-- TABLE -->
                 <template if:true={members.length}>
                <lightning-datatable
                    key-field="Id"
                    data={members}
                    columns={columns}
                    onrowaction={handleRowAction}
                    onrowselection={handleRowSelection}>
                </lightning-datatable>
                 </template>

                  <template if:true={dataLoaded}>

            <template if:false={members.length}>

                <div class="empty-state">

                    <div class="empty-icon">
                        📂
                    </div>

                    <h2>No Members Found</h2>

                    <p>
                        Click Add Member to create your first member.
                    </p>

                </div>

            </template>

        </template>
     </lightning-card>

    </template>

    </template>
    </template>
    <!-- TRANSACTION PAGE -->
    <template if:true={showTransactions}>
         
        <c-transaction
            family-id={familyId}
            onbackmember={handleBackTransaction}
    onbackfamily={handleBackToFamily}>
        </c-transaction>

    </template>

    <!-- LOAN PAGE -->
  <template if:true={showLoans}>

    <c-loan
    family-id={familyId}
        member-name={name}
        onbackmember={handleBackLoan}>
    </c-loan>

  </template>
 <!-- ADD MEMBER MODAL -->
    <template if:true={showModal}>

        <section class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Add Member</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-input 
                        label="Name"
                        required
                        onchange={handleName}>
                    </lightning-input>

                    <lightning-input 
                        label="Address"
                        
                        onchange={handleAddress}>
                    </lightning-input>

                    <lightning-input 
                        type="number"
                        label="Age"
                        
                        onchange={handleAge}>
                    </lightning-input>

                    <lightning-input
                        type="tel" 
                        label="Phone"
                         maxlength="10"
                         pattern="[0-9]{10}"
                         message-when-pattern-mismatch="Enter valid 10 digit phone number"
                        
                        onchange={handlePhone}>
                    </lightning-input>

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        class="slds-m-right_small"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        label="Save"
                        variant="brand"
                        onclick={handlesaveMember}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

    <!-- EDIT MODAL -->
    <template if:true={showEditModal}>

        <section class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Edit Member</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-input
                        label="Name"
                        value={name}
                        onchange={handleName}>
                    </lightning-input>

                    <lightning-input
                        label="Address"
                        value={address}
                        onchange={handleAddress}>
                    </lightning-input>

                    <lightning-input
                        type="number"
                        label="Age"
                        value={age}
                        onchange={handleAge}>
                    </lightning-input>

                    <lightning-input
                        label="Phone"
                        value={phone}
                        onchange={handlePhone}>
                    </lightning-input>

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        class="slds-m-right_small"
                        onclick={closeEditModal}>
                    </lightning-button>

                    <lightning-button
                        label="Update"
                        variant="brand"
                        onclick={updateMemberHandler}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

    <!-- DELETE MODAL -->
    <template if:true={showDeleteModal}>

        <section class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2>Confirm Delete</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <p>
                        Are you sure you want to delete "{name}"?
                    </p>

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        class="slds-m-right_small"
                        onclick={closeDeleteModal}>
                    </lightning-button>

                    <lightning-button
                        label="Delete"
                        variant="destructive"
                        onclick={confirmDelete}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

    <!-- CREATE LOAN MODAL -->
  <template if:true={showLoanModal}>

     <section class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">

            <header class="slds-modal__header">
                <h2>Apply Loan</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">

                <lightning-input
                    label="Member Name"
                    value={name}
                    disabled>
                </lightning-input>

                <lightning-input
                    type="number"
                    label="Loan Amount"
                    onchange={handleLoanAmount}>
                </lightning-input>

                <lightning-input
                    type="date"
                    label="Loan Date"
                    value={loanDate}
                    disabled
                    onchange={handleLoanDate}>
                </lightning-input>

                <!-- PAPER FEE -->
            <div class="slds-m-top_medium">
                <p><strong>Paper Fee:</strong> ₹{paperFee}</p>
            </div>

            <!-- EMI DURATION -->
            <div class="slds-m-top_small">
                <p><strong>Duration:</strong> 24 Months</p>
            </div>

            <!-- MONTHLY EMI -->
            <div class="slds-m-top_small">
                <p><strong>Monthly EMI:</strong> ₹{monthlyEMI}</p>
            </div>

            <!-- TOTAL AMOUNT -->
            <div class="slds-m-top_small">
                <p><strong>Total Amount:</strong> ₹{totalAmount}</p>
            </div>
            </div>

            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    class="slds-m-right_small"
                    onclick={closeLoanModal}>
                </lightning-button>

                <lightning-button
                    label="Apply Loan"
                    variant="brand"
                    onclick={saveLoan}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>
    <!-- ADD TRANSACTION MODAL -->
<template if:true={showTransactionModal}>
   

    <section class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">

            <header class="slds-modal__header">

                <h2>Add Transaction</h2>

            </header>
             <template if:true={isLoading}>

    <div class="spinner-container">

        <lightning-spinner
            alternative-text="Saving..."
            size="large">
        </lightning-spinner>

    </div>

</template>
// add transaction
  <div class="slds-modal__content slds-p-around_medium">

                <lightning-input
                    label="Member Name"
                    value={name}
                    disabled>
                </lightning-input>

                <lightning-input
                    type="date"
                    label="Payment Date"
                    required
                    onchange={handlePaymentDate}>
                </lightning-input>

                <lightning-combobox
                    label="Type"
                    required
                    options={typeoptions}
                    onchange={handleTransactionType}>
                </lightning-combobox>

                <lightning-input
                    type="number"
                    label="Amount"
                    required
                    value={amount}
                    onchange={handleAmount}>
                </lightning-input>

            </div>

            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    class="slds-m-right_small"
                    onclick={closeTransactionModal}>
                </lightning-button>

                <lightning-button
                    label="Pay"
                    variant="brand"
                    onclick={saveTransaction}
                    disabled={isLoading}>
                </lightning-button>

            </footer>

        </div>

    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>

</template>

</template>
